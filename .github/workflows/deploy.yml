# Every push to main deploys the backend to the Oracle server: the files are copied over SSH and the server
# rebuilds and restarts the containers. Settings and passwords live only in ~/zuno-backend/.env on the server.
#
# Repository settings > Secrets and variables > Actions:
#   secrets   DEPLOY_HOST          the server's public IP
#             DEPLOY_USER          opc
#             DEPLOY_SSH_KEY       private key allowed to log in to the server (a deploy-only key)
#             DEPLOY_KNOWN_HOSTS   the server's host key line (ssh-keyscan output), so the connection is verified
#   variables BACKEND_DOMAIN       e.g. 140-245-225-16.sslip.io, for the health check
name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of interrupting it
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' "$HOST" "$USER" > ~/.ssh/config

      - name: Copy files to the server
        # --delete keeps the server in step with the repo; .env and the Docker data are never touched
        run: rsync -az --delete --exclude .git --exclude .github --exclude .env ./ server:zuno-backend/

      - name: Build and restart
        run: ssh server 'cd ~/zuno-backend && sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans && sudo docker image prune -f'

      - name: Check the backend answers
        env:
          DOMAIN: ${{ vars.BACKEND_DOMAIN }}
        run: curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "https://$DOMAIN/api/zuno/health"
